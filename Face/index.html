<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verifiq - Face</title>
    <link rel="icon" type="image/png" href="../verifiq.png?v=2" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="face-shell">
      <section class="hero-panel">
        <div class="brand">
          <span class="brand-mark">VERIFIQ</span>
          <p class="eyebrow" id="modeLabel">Reconhecimento facial</p>
        </div>
        <h1 id="title">Cadastre sua facial</h1>
        <p id="description">
          Use a câmera para registrar seu rosto antes de continuar.
        </p>
        <div class="stats">
          <div>
            <strong id="usuarioNome">Usuário</strong>
            <span>Logado</span>
          </div>
          <div>
            <strong id="modeBadge">Cadastro</strong>
            <span>Fluxo ativo</span>
          </div>
        </div>
        <div class="actions">
          <button id="captureBtn" class="primary">Capturar e enviar</button>
          <button id="switchBtn" class="secondary">Trocar para ponto</button>
        </div>
        <div class="message" id="message"></div>
        <a class="back-link" href="../Dashboard/dashboard.html">Voltar ao dashboard</a>
      </section>

      <section class="camera-panel">
        <div class="camera-frame">
          <video id="video" autoplay playsinline></video>
          <canvas id="canvas" hidden></canvas>
          <div class="camera-overlay">
            <span class="pulse"></span>
            <span>Posicione o rosto no centro</span>
          </div>
        </div>
        <div class="camera-hints">
          <span>Luz frontal</span>
          <span>Olhar para a câmera</span>
          <span>Fundo simples ajuda</span>
        </div>
      </section>
    </main>

    <script src="../config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
