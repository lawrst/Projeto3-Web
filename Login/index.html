<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verifiq - Login</title>
    <link rel="icon" type="image/png" href="../verifiq.png?v=2" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="login-container">
      <div class="login-box">
        <div class="login-content">
          <div
            class="logo-verifiq"
            style="display: flex; align-items: center; gap: 15px"
          >
            <img
              src="../verifiq 1.png"
              alt="Logo Verifiq"
              style="width: 60px; height: auto"
            />
            <span style="font-size: 32px; color: #005484; font-weight: bold"
              >VERIFIQ</span
            >
          </div>

          <h1>Entre na sua conta</h1>
          <p class="subtitle">Coloque seus dados para entrar na sua conta.</p>

          <form id="loginForm">
            <div class="input-group">
              <label for="email">E-mail</label>
              <input
                type="email"
                id="email"
                placeholder="usuario@gmail.com"
                required
              />
            </div>

            <div class="input-group">
              <label for="password">Senha</label>
              <input
                type="password"
                id="password"
                placeholder="••••••••"
                required
              />
            </div>

            <button type="submit" id="loginBtn">Entrar</button>
          </form>

          <div class="signup-link">
            Não possui conta?
            <a href="../Cadastro/cadastro.html">Cadastre-se</a>
          </div>

          <div class="download-card">
            <p class="download-title">Agente desktop</p>
            <p class="download-text">
              Baixe o executável do VERIFIQ para instalar o agente local na máquina do usuário.
            </p>
            <a class="download-btn" data-desktop-download href="#">
              Baixar .exe do desktop
            </a>
          </div>

          <div id="message"></div>
        </div>
      </div>

      <div class="login-visual">
        <div class="visual-pattern"></div>
      </div>
    </div>

    <script src="../config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
